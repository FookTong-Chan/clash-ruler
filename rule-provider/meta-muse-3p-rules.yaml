# Meta Muse 第三方域规则集（可选）
# 逆向取证源：https://github.com/mahdi-salmanzade/meta-muse-teardown @ main
#   人工整理源：https://github.com/juner922/muse-loon-rules @ main
# Muse 代码路径能触达的非 Meta 域：Play 服务 / Stripe 支付 / 连接器
# OAuth / jsDelivr 渲染 / VM 网关白名单等
# 可选集：APNs、NTP、地图瓦片、CRL 等已剔除（代理过去只会变慢）
